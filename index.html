    /**
     * ============================================================================
     * [애플리케이션 상태 관리 및 로컬 스토리지 자동 저장]
     * ============================================================================
     */
    const STORAGE_KEY = 'mock_trial_script_builder_v4';

    const DEFAULT_STATE = {
      currentStep: 1,
      student: {
        grade: '1',
        classNum: '',
        number: '',
        name: ''
      },
      selectedCaseId: 'criminal',
      selectedRoleId: '',
      preTrialJudgment: {
        choiceId: '',
        choiceLabel: '',
        reason: '',
        locked: false
      },
      workshop: {
        selectedEvidenceIds: [],
        analysisAnswers: {},
        perspectiveAnswers: {},
        factCheckAnswers: {},
        checkpointAnswers: {},
        orderAnswer: '',
        selectedSpeeches: {},
        jurorNotes: {
          prosecutionEv: '',
          defenseEv: '',
          reliableTestimony: '',
          remainingDoubts: ''
        }
      }
    };

    let appState = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        return {
          ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
          ...parsed,
          student: { ...DEFAULT_STATE.student, ...(parsed.student || {}) },
          preTrialJudgment: { ...DEFAULT_STATE.preTrialJudgment, ...(parsed.preTrialJudgment || {}) },
          workshop: {
            ...DEFAULT_STATE.workshop,
            ...(parsed.workshop || {}),
            jurorNotes: {
              ...DEFAULT_STATE.workshop.jurorNotes,
              ...((parsed.workshop && parsed.workshop.jurorNotes) || {})
            }
          }
        };
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        // 스토리지 제한 환경 무시
      }
    }

    function promptResetApp() {
      openModal(
        '처음부터 다시 시작할까요?',
        '지금까지 입력한 정보와 선택한 대본이 모두 초기화됩니다. 계속하시겠습니까?',
        '초기화하기',
        () => {
          localStorage.removeItem(STORAGE_KEY);
          appState = JSON.parse(JSON.stringify(DEFAULT_STATE));
          saveState();
          renderApp();
          showToast('모든 기록이 초기화되었습니다.', '🔄');
        }
      );
    }

    function downloadHtmlFile() {
      try {
        const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '법정의선택_모의재판_대본만들기.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('HTML 파일이 다운로드되었습니다!', '💾');
      } catch (err) {
        showToast('파일 저장 중 오류가 발생했습니다.', '⚠️');
      }
    }

    /**
     * ============================================================================
     * [커스텀 토스트 및 확인 모달 (alert / confirm 대체)]
     * ============================================================================
     */
    let toastTimer = null;
    function showToast(message, icon = 'ℹ️') {
      const toast = document.getElementById('toast-notification');
      document.getElementById('toast-message').textContent = message;
      document.getElementById('toast-icon').textContent = icon;
      toast.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 3400);
    }

    let pendingModalAction = null;
    function openModal(title, body, confirmLabel, onConfirm) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').textContent = body;
      const btn = document.getElementById('modal-confirm-btn');
      btn.textContent = confirmLabel;
      pendingModalAction = onConfirm;
      btn.onclick = () => {
        const action = pendingModalAction;
        closeModal();
        if (typeof action === 'function') {
          action();
        }
      };
      document.getElementById('custom-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('custom-modal').classList.add('hidden');
      pendingModalAction = null;
    }

    /**
     * ============================================================================
     * [네비게이션 및 진행 단계 관리]
     * ============================================================================
     */
    const STEPS = [
      { num: 1, label: 'STEP 1', title: '사건·역할' },
      { num: 2, label: 'STEP 2', title: '사건 기록' },
      { num: 3, label: 'STEP 3', title: '첫 판단' },
      { num: 4, label: 'STEP 4', title: '역할 카드' },
      { num: 5, label: 'STEP 5', title: '대본 제작' },
      { num: 6, label: 'STEP 6', title: '완성 대본' }
    ];

    function getMaxAccessibleStep() {
      if (!appState.selectedRoleId || !appState.student.name.trim()) return 1;
      if (!appState.preTrialJudgment.locked) return 3;
      return 6;
    }

    function navigateToStep(stepNum) {
      const maxStep = getMaxAccessibleStep();
      if (stepNum > maxStep) {
        if (maxStep === 1) {
          showToast('먼저 학년·반·번호·이름과 사건 및 역할을 선택해 주세요.', '⚠️');
        } else if (maxStep === 3) {
          showToast('STEP 3에서 재판 전 첫 번째 판결을 먼저 확정해 주세요.', '⚠️');
        }
        return;
      }
      appState.currentStep = stepNum;
      saveState();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderHeaderAndStepper() {
      const roleObj = appState.selectedRoleId ? MOCK_TRIAL_DATA.roles[appState.selectedRoleId] : null;
      const caseObj = MOCK_TRIAL_DATA.cases[appState.selectedCaseId];

      const badge = document.getElementById('header-role-badge');
      if (roleObj && appState.student.name.trim()) {
        badge.classList.remove('hidden');
        document.getElementById('header-case-tag').textContent = caseObj.trialType;
        document.getElementById('header-role-name').textContent = `${roleObj.name} (${appState.student.name})`;
      } else {
        badge.classList.add('hidden');
      }

      const stepperEl = document.getElementById('stepper-container');
      const maxStep = getMaxAccessibleStep();

      stepperEl.innerHTML = STEPS.map((st, idx) => {
        const isCurrent = appState.currentStep === st.num;
        const isCompleted = st.num < appState.currentStep;
        const isLocked = st.num > maxStep;

        let btnClass = 'bg-white/5 text-slate-300 border-white/10 hover:bg-white/15';
        if (isCurrent) {
          btnClass = 'bg-amber-500 text-slate-950 font-bold border-amber-400 shadow-sm';
        } else if (isCompleted) {
          btnClass = 'bg-emerald-700/80 text-white border-emerald-500/50 hover:bg-emerald-700';
        } else if (isLocked) {
          btnClass = 'bg-white/5 text-slate-500 border-white/5 cursor-not-allowed opacity-60';
        }

        const arrow = idx < STEPS.length - 1
          ? '<span class="text-slate-500 text-xs shrink-0">›</span>'
          : '';

        return `
          <button type="button" onclick="navigateToStep(${st.num})"
            class="flex-1 px-2.5 py-1.5 rounded-lg border text-xs transition flex items-center justify-center gap-1.5 shrink-0 ${btnClass}">
            <span class="opacity-80">${isCompleted ? '✓' : st.num}</span>
            <span>${st.title}</span>
          </button>
          ${arrow}
        `;
      }).join('');
    }

    /**
     * ============================================================================
     * [STEP 1: 사건과 역할 선택]
     * ============================================================================
     */
    function renderStep1() {
      const selectedCase = MOCK_TRIAL_DATA.cases[appState.selectedCaseId];

                    class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">번호</label>
                  <input type="text" id="input-number" value="${escapeHtml(appState.student.number)}"

                  <label class="block text-xs font-semibold text-slate-600 mb-1">이름 <span class="text-rose-600">*</span></label>

            <!-- 2. 사건 선택 (형사 vs 민사) -->

              <h3 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-court-navy text-white text-xs flex items-center justify-center">2</span>

                        : 'border-slate-200 bg-white hover:border-slate-400'}">
                      <div class="flex items-center justify-between gap-2 mb-2">
                        <span class="px-2.5 py-1 rounded-md text-xs font-bold ${isCrim ? 'bg-rose-800 text-white' : 'bg-emerald-800 text-white'}">

                  [${selectedCase.trialType}] 나의 역할 선택 (총 14개 역할)
                </h3>
                <span class="text-xs text-slate-500">선택한 역할에 따라 대본 제작 방식이 달라집니다.</span>

              <div class="space-y-5">

                    <h4 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">${groupName}</h4>

              </p>
              <button type="button" onclick="completeStep1()"
                class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-court-navy hover:bg-court-navyLight text-white font-bold text-sm shadow-md transition flex items-center justify-center gap-2">

                <span>→</span>
              </button>
            </div>
          </div>
        </div>
      `;

    function updateStudentField(field, value) {
      appState.student[field] = value;
      saveState();
      renderHeaderAndStepper();
    }

    function selectCase(caseId) {
      if (appState.selectedCaseId === caseId) return;
      if (appState.preTrialJudgment.locked) {
        openModal(
          '사건을 변경할까요?',
          '이미 잠정 판결을 확정한 상태입니다. 사건을 변경하면 이전 진행 기록이 초기화됩니다.',
          '사건 변경 및 초기화',
          () => {
            const savedStudent = { ...appState.student };
            appState = JSON.parse(JSON.stringify(DEFAULT_STATE));
            appState.student = savedStudent;
            appState.selectedCaseId = caseId;
            saveState();
            renderApp();
          }
        );
        return;
      }
      appState.selectedCaseId = caseId;
      appState.selectedRoleId = '';
      saveState();
      renderApp();
    }

    function selectRole(roleId) {
      if (appState.selectedRoleId === roleId) return;
      if (appState.preTrialJudgment.locked && appState.selectedRoleId) {
        openModal(
          '역할을 변경할까요?',
          '역할을 변경하면 새로운 역할에 맞춰 대본 제작 단계를 다시 진행하게 됩니다.',
          '역할 변경하기',
          () => {
            appState.selectedRoleId = roleId;
            appState.workshop = JSON.parse(JSON.stringify(DEFAULT_STATE.workshop));
            saveState();
            renderApp();
            showToast('새로운 역할이 선택되었습니다.', '🎭');
          }
        );
        return;
      }
      appState.selectedRoleId = roleId;
      saveState();
      renderApp();
    }

    function completeStep1() {
      if (!appState.student.name.trim()) {
        showToast('이름을 입력해 주세요.', '⚠️');
        document.getElementById('input-name').focus();
        return;
      }
      if (!appState.selectedRoleId) {
        showToast('맡은 역할을 하나 선택해 주세요.', '⚠️');
        return;
      }
      navigateToStep(2);
    }

        <div class="fade-in space-y-6">

            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 border-b-2 border-slate-800 pb-5 mb-6">

    /**
     * ============================================================================
     * [STEP 3: 재판 전 첫 번째 판결]
     * ============================================================================
     */
    function renderStep3() {
      const caseObj = MOCK_TRIAL_DATA.cases[appState.selectedCaseId];
      const pt = appState.preTrialJudgment;

      return `
        <div class="fade-in space-y-6">
          <div class="dossier-paper rounded-2xl p-6 sm:p-8 border-t-4 border-amber-600">
            <div class="border-b border-stone-200 pb-4 mb-6">

              </span>
              <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 font-court-serif">

                <p class="font-bold text-amber-300 mb-1">잠정적 판단 안내 (확정 후 수정 불가)</p>

                `;

                value="${escapeHtml(pt.reason)}"
                ${pt.locked ? 'disabled' : `oninput="updatePreTrialReason(this.value)"`}
                placeholder=""
                class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 disabled:bg-slate-100 disabled:text-slate-600" />
            </div>

            <div class="pt-5 border-t border-stone-200 flex flex-col sm:flex-row items-center justify-between gap-3">
              <button type="button" onclick="navigateToStep(2)"
                class="w-full sm:w-auto px-4 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm transition">
                ← 이전 (사건 기록)
              </button>

              ${pt.locked ? `
                <button type="button" onclick="navigateToStep(4)"
                  class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-court-navy hover:bg-court-navyLight text-white font-bold text-sm shadow-md transition">
                  나의 비밀 역할 카드 확인하기 (STEP 4) →
                </button>
              ` : `
                <button type="button" onclick="lockPreTrialJudgment()"
                  class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-sm shadow-md transition">
                  첫 번째 판단 확정 및 역할 카드 열기 →
                </button>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function selectPreTrialChoice(choiceId, choiceLabel) {
      if (appState.preTrialJudgment.locked) return;
      appState.preTrialJudgment.choiceId = choiceId;
      appState.preTrialJudgment.choiceLabel = choiceLabel;
      saveState();
      renderApp();
    }

    function updatePreTrialReason(val) {
      if (appState.preTrialJudgment.locked) return;
      appState.preTrialJudgment.reason = val;
      saveState();
    }

    function lockPreTrialJudgment() {
      if (!appState.preTrialJudgment.choiceId) {
        showToast('먼저 재판 전 잠정 판결 선택지를 하나 골라 주세요.', '⚠️');
        return;
      }
      openModal(
        '첫 번째 판단을 확정할까요?',
        `선택하신 "${appState.preTrialJudgment.choiceLabel}" 판단은 확정 후 수정할 수 없으며, 완성된 대본의 준비 노트에 기록됩니다.`,
        '확정하고 역할 카드 보기',
        () => {
          appState.preTrialJudgment.locked = true;
          saveState();
          showToast('잠정 판결이 저장되었습니다! 이제 역할 카드를 확인하세요.', '🔒');
          navigateToStep(4);
        }
      );
    }

    /**
     * ============================================================================
     * [STEP 4: 나의 역할 카드 확인]
     * ============================================================================
     */
    function renderStep4() {

      const roleObj = MOCK_TRIAL_DATA.roles[appState.selectedRoleId];

      return `

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b-2 border-slate-800 pb-4 mb-6">
              <div>
                <span class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-900 mb-2">
                  STEP 4 / 6 · 나의 비밀 역할 카드
                </span>
                <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 font-court-serif">
                  역할: ${roleObj.name} <span class="text-base font-sans font-semibold text-slate-500">(${roleObj.group})</span>
                </h2>
              </div>
              <div class="px-3.5 py-2 rounded-xl bg-court-navy text-amber-300 text-xs font-bold self-start">

            <div class="bg-amber-50 border border-amber-300 rounded-xl p-3.5 mb-6 text-xs text-amber-950 flex items-start gap-2.5">
              <span class="text-base">🤫</span>
              <p class="leading-relaxed">
                <strong>역할별 정보 차이 안내:</strong> 이 역할 카드에는 다른 역할 친구들이 아직 모르는 나만의 세부 상황과 증거가 담겨 있습니다. 내용을 잘 기억한 뒤 다음 단계에서 내 대사를 완성해 보세요.
              </p>
            </div>

            <div class="space-y-4">
              <div class="bg-white p-5 rounded-xl border border-stone-200 shadow-sm">
                <h3 class="text-xs font-extrabold uppercase tracking-wider text-amber-800 mb-1.5">🎯 내가 맡은 임무</h3>
                <p class="text-sm sm:text-base font-semibold text-slate-900 leading-relaxed">${rc.duty}</p>
              </div>

              <div class="bg-white p-5 rounded-xl border border-stone-200 shadow-sm">
                <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-600 mb-1.5">📋 내가 알고 있는 사실</h3>
                <p class="text-sm text-slate-700 leading-relaxed">${rc.knownFacts}</p>

              <div class="bg-white p-5 rounded-xl border border-stone-200 shadow-sm">
                <h3 class="text-xs font-extrabold uppercase tracking-wider text-emerald-800 mb-1.5">🔍 나에게 유리하거나 중요한 증거</h3>
                <p class="text-sm text-slate-700 leading-relaxed">${rc.keyEvidence}</p>
              </div>

              <div class="bg-rose-50/70 p-5 rounded-xl border border-rose-200">
                <h3 class="text-xs font-extrabold uppercase tracking-wider text-rose-900 mb-1.5">⚠️ 내가 주의해야 할 점</h3>
                <p class="text-sm text-rose-950 font-medium leading-relaxed">${rc.caution}</p>
              </div>

              <div class="bg-slate-100 p-4 rounded-xl border border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs">
                <span class="font-bold text-slate-700">🎙️ 실제 재판 발언 차례 번호:</span>
                <span class="px-3 py-1 rounded-lg bg-court-navy text-amber-300 font-bold">${rc.speakingCodes.join(' → ')}</span>
              </div>
            </div>

            <div class="mt-8 pt-5 border-t border-stone-200 flex items-center justify-between gap-3">
              <button type="button" onclick="navigateToStep(3)"
                class="px-4 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm transition">
                ← 이전 (첫 판단 확인)
              </button>
              <button type="button" onclick="navigateToStep(5)"
                class="px-6 py-3.5 rounded-xl bg-court-navy hover:bg-court-navyLight text-white font-bold text-sm shadow-md transition">
                나의 재판 대본 제작하기 (STEP 5) →
              </button>
            </div>
          </div>
        </div>
      `;
    }

    /**
     * ============================================================================
     * [STEP 5: 역할별 맞춤형 재판 대본 제작 워크숍 (유형 A ~ F)]
     * ============================================================================
     */
    function renderStep5() {
      const roleObj = MOCK_TRIAL_DATA.roles[appState.selectedRoleId];
      let innerHtml = '';

      switch (roleObj.type) {
        case 'A':
          innerHtml = renderWorkshopTypeA(roleObj);
          break;
        case 'B':
          innerHtml = renderWorkshopTypeB(roleObj);
          break;
        case 'C':
          innerHtml = renderWorkshopTypeC(roleObj);
          break;
        case 'D':
          innerHtml = renderWorkshopTypeD(roleObj);
          break;
        case 'E':
          innerHtml = renderWorkshopTypeE(roleObj);
          break;
        case 'F':
          innerHtml = renderWorkshopTypeF(roleObj);
          break;
        default:
          innerHtml = renderWorkshopTypeA(roleObj);
      }

      return `
        <div class="fade-in space-y-6">
          <div class="dossier-paper rounded-2xl p-6 sm:p-8 border-t-4 border-amber-600">
            <div class="border-b border-stone-200 pb-4 mb-6">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                <span class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-900">
                  STEP 5 / 6 · 역할별 대본 제작 워크숍
                </span>
                <span class="text-xs font-bold text-slate-500">담당 역할: ${roleObj.name}</span>
              </div>
              <h2 class="text-xl sm:text-2xl font-bold text-slate-900 font-court-serif">
                ${roleObj.typeName}
              </h2>
              <p class="text-xs sm:text-sm text-slate-600 mt-1">

              </p>
            </div>

            ${innerHtml}

            <div class="mt-8 pt-5 border-t border-stone-200 flex flex-col sm:flex-row items-center justify-between gap-3">
              <button type="button" onclick="navigateToStep(4)"
                class="w-full sm:w-auto px-4 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm transition">
                ← 이전 (역할 카드 다시 보기)
              </button>
              <button type="button" onclick="validateAndCompleteStep5()"
                class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-court-navy hover:bg-court-navyLight text-white font-bold text-sm shadow-md transition">
                나의 모의재판 최종 대본 완성하기 (STEP 6) →
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderWorkshopTypeA(roleObj) {
      const td = roleObj.typeData;
      const selectedEvIds = appState.workshop.selectedEvidenceIds || [];
      const analysisAnswers = appState.workshop.analysisAnswers || {};
      const selectedSpeeches = appState.workshop.selectedSpeeches || {};

      return `
        <div class="space-y-8">
          <section class="bg-white p-5 rounded-xl border border-stone-200">
            <h3 class="text-sm font-bold text-slate-900 mb-2 flex items-center gap-2">
              <span class="px-2 py-0.5 rounded bg-slate-800 text-white text-xs">1단계</span>
              법률가 전략 브리핑 읽기
            </h3>
            <p class="text-sm text-slate-700 leading-relaxed">${td.briefing}</p>
          </section>

          <section class="bg-indigo-50/40 p-5 rounded-xl border border-indigo-200">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <h3 class="text-sm font-bold text-indigo-950 flex items-center gap-2">
                <span class="px-2 py-0.5 rounded bg-indigo-700 text-white text-xs">🧠 사고력 탐구 · 2단계</span>
                주장에 유리한 증거 찾기 (최대 2개 선택)
              </h3>
              <span class="text-xs font-bold text-indigo-800">선택됨: ${selectedEvIds.length} / 2개</span>
            </div>
            <p class="text-xs text-slate-600 mb-4">
              직접 증거, 정황 증거, 근거 없는 추측이 섞여 있습니다. 법정에서 설득력을 가질 증거 1~2개를 골라 보세요.
            </p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              ${(td.evidencePool || []).map(ev => {
                const isChecked = selectedEvIds.includes(ev.id);
                return `
                  <div onclick="toggleEvidenceA('${ev.id}')"
                    class="p-4 rounded-xl border-2 cursor-pointer transition bg-white ${isChecked
                      ? (ev.recommended ? 'border-emerald-600 ring-2 ring-emerald-500/20' : 'border-rose-500 ring-2 ring-rose-500/20')
                      : 'border-slate-200 hover:border-indigo-400'}">
                    <div class="flex items-center justify-between gap-2 mb-1.5">
                      <span class="text-sm font-bold text-slate-900">${ev.title}</span>
                      <span class="text-xs font-bold px-2 py-0.5 rounded ${isChecked ? 'bg-indigo-700 text-white' : 'bg-slate-100 text-slate-500'}">
                        ${isChecked ? '✓ 선택됨' : '선택'}
                      </span>
                    </div>
                    <p class="text-xs text-slate-600 leading-relaxed mb-2">${ev.desc}</p>
                    ${isChecked ? `
                      <div class="mt-2 p-2.5 rounded-lg text-xs leading-relaxed ${ev.recommended ? 'bg-emerald-50 text-emerald-900 border border-emerald-200' : 'bg-rose-50 text-rose-900 border border-rose-200'}">
                        <strong>[${ev.category}]</strong> ${ev.feedback}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </section>

          <section class="bg-indigo-50/40 p-5 rounded-xl border border-indigo-200 space-y-4">
            <h3 class="text-sm font-bold text-indigo-950 flex items-center gap-2">
              <span class="px-2 py-0.5 rounded bg-indigo-700 text-white text-xs">🧠 사고력 탐구 · 3단계</span>
              증거 해석 및 논리 구성 질문
            </h3>
            ${(td.analysisQuestions || []).map((q, qIdx) => {
              const chosenOptId = analysisAnswers[q.id];
              const chosenOpt = q.options.find(o => o.id === chosenOptId);
              return `
                <div class="bg-white p-4 rounded-xl border border-slate-200">
                  <p class="text-sm font-bold text-slate-900 mb-3">Q${qIdx + 1}. ${q.question}</p>
                  <div class="space-y-2">
                    ${q.options.map(opt => {
                      const active = chosenOptId === opt.id;
                      return `
                        <button type="button" onclick="selectAnalysisAnswerA('${q.id}', '${opt.id}')"
                          class="w-full text-left p-3 rounded-lg border text-xs sm:text-sm transition ${active
                            ? (opt.valid ? 'border-emerald-600 bg-emerald-50 font-semibold text-slate-900' : 'border-rose-500 bg-rose-50 text-rose-950')
                            : 'border-slate-200 hover:bg-slate-50 text-slate-700'}">
                          ${active ? (opt.valid ? '✅ ' : '⚠️ ') : '○ '} ${opt.text}
                        </button>
                      `;
                    }).join('')}
                  </div>
                  ${chosenOpt ? `
                    <p class="mt-2.5 text-xs p-2.5 rounded-lg ${chosenOpt.valid ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-800 font-semibold'}">
                      ${chosenOpt.feedback}
                    </p>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </section>

          <section class="bg-amber-50/80 p-5 rounded-xl border-2 border-amber-400 space-y-5">
            <div>
              <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                <span class="px-2.5 py-0.5 rounded bg-amber-500 text-slate-950 text-xs font-extrabold">🎙️ 실제 법정 대사 · 4단계</span>
                모의재판에서 내가 직접 읽을 대사 선택
              </h3>
              <p class="text-xs text-slate-700 mt-1">
                지나치게 단정하거나 근거 없는 선택지는 피드백이 표시됩니다. 법적으로 타당한 표준 대사를 선택하세요.
              </p>
            </div>

            ${(td.speeches || []).map(sp => {
              const chosenId = selectedSpeeches[sp.code];
              const chosenObj = sp.options.find(o => o.id === chosenId);
              return `
                <div class="bg-white p-4 sm:p-5 rounded-xl border border-amber-300 shadow-sm">
                  <div class="flex items-center gap-2 mb-2">
                    <span class="px-2 py-0.5 rounded bg-court-navy text-amber-300 font-bold text-xs">${sp.code}</span>
                    <span class="text-sm font-bold text-slate-900">${sp.stageLabel}</span>
                  </div>
                  <p class="text-xs text-slate-600 mb-3">${sp.prompt}</p>
                  <div class="space-y-2.5">
                    ${sp.options.map((opt, i) => {
                      const active = chosenId === opt.id;
                      const letter = ['A', 'B', 'C'][i] || (i + 1);
                      return `
                        <button type="button" onclick="selectSpeechLine('${sp.code}', '${opt.id}')"
                          class="w-full text-left p-3.5 rounded-xl border-2 transition ${active
                            ? (opt.valid ? 'border-amber-600 bg-amber-50/80 shadow-sm' : 'border-rose-500 bg-rose-50')
                            : 'border-slate-200 hover:border-amber-300'}">
                          <div class="flex items-start gap-2.5">
                            <span class="w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center shrink-0 mt-0.5 ${active ? (opt.valid ? 'bg-amber-600 text-white' : 'bg-rose-600 text-white') : 'bg-slate-100 text-slate-700'}">
                              ${letter}
                            </span>
                            <p class="text-sm text-slate-800 leading-relaxed">"${opt.text}"</p>
                          </div>
                        </button>
                      `;
                    }).join('')}
                  </div>
                  ${chosenObj ? `
                    <div class="mt-3 p-3 rounded-lg text-xs leading-relaxed ${chosenObj.valid ? 'bg-emerald-50 text-emerald-900 border border-emerald-200' : 'bg-rose-50 text-rose-900 border border-rose-300 font-semibold'}">
                      ${chosenObj.feedback}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </section>
        </div>
      `;
    }

    function toggleEvidenceA(evId) {
      const roleObj = MOCK_TRIAL_DATA.roles[appState.selectedRoleId];
      const evObj = roleObj.typeData.evidencePool.find(e => e.id === evId);
      let list = [...(appState.workshop.selectedEvidenceIds || [])];
      if (list.includes(evId)) {
        list = list.filter(id => id !== evId);
      } else {
        if (list.length >= 2) {
          showToast('증거는 최대 2개까지 선택할 수 있습니다. 기존 선택을 해제한 뒤 골라 주세요.', '⚠️');
          return;
        }
        list.push(evId);
        if (evObj && !evObj.recommended) {
          showToast('추측성 자료입니다. 다른 증거로 바꾸어 선택해 보세요!', '⚠️');
        }
      }
      appState.workshop.selectedEvidenceIds = list;
      saveState();
      renderApp();
    }

    function selectAnalysisAnswerA(qId, optId) {
      appState.workshop.analysisAnswers = appState.workshop.analysisAnswers || {};
      appState.workshop.analysisAnswers[qId] = optId;
      saveState();
      renderApp();
    }

    function selectSpeechLine(code, optId) {
      appState.workshop.selectedSpeeches = appState.workshop.selectedSpeeches || {};
      appState.workshop.selectedSpeeches[code] = optId;
      saveState();
      renderApp();
    }

    function renderWorkshopTypeB(roleObj) {
      const td = roleObj.typeData;
      const pQuestions = td.perspectiveQuestions || td.analysisQuestions || [];
      const perspectiveAnswers = appState.workshop.perspectiveAnswers || {};
      const selectedSpeeches = appState.workshop.selectedSpeeches || {};

      return `
        <div class="space-y-6">
          <section class="bg-white p-5 rounded-xl border border-stone-200">
            <h3 class="text-sm font-bold text-slate-900 mb-1.5">당사자 진술 준비 안내</h3>
            <p class="text-sm text-slate-700 leading-relaxed">${td.briefing}</p>
          </section>

          <section class="bg-indigo-50/40 p-5 rounded-xl border border-indigo-200 space-y-4">
            <h3 class="text-sm font-bold text-indigo-950 flex items-center gap-2">
              <span class="px-2 py-0.5 rounded bg-indigo-700 text-white text-xs">🧠 사고력 탐구</span>
              나의 입장 및 사실관계 정리
            </h3>
            ${pQuestions.map((pq, idx) => {
              const chosenId = perspectiveAnswers[pq.id];
              const chosenOpt = pq.options.find(o => o.id === chosenId);
              return `
                <div class="bg-white p-4 rounded-xl border border-slate-200">
                  <p class="text-sm font-bold text-slate-900 mb-3">${idx + 1}. ${pq.question}</p>
                  <div class="space-y-2">
                    ${pq.options.map(opt => {
                      const active = chosenId === opt.id;
                      return `
                        <button type="button" onclick="selectPerspectiveB('${pq.id}', '${opt.id}')"
                          class="w-full text-left p-3 rounded-lg border text-xs sm:text-sm transition ${active
                            ? (opt.valid ? 'border-emerald-600 bg-emerald-50 font-semibold' : 'border-rose-500 bg-rose-50 text-rose-950')
                            : 'border-slate-200 hover:bg-slate-50'}">
                          ${active ? (opt.valid ? '✅ ' : '⚠️ ') : '○ '} ${opt.text}
                        </button>
                      `;
                    }).join('')}
                  </div>
                  ${chosenOpt ? `<p class="mt-2 text-xs p-2.5 rounded-lg ${chosenOpt.valid ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-800 font-semibold'}">${chosenOpt.feedback}</p>` : ''}
                </div>
              `;
            }).join('')}
          </section>

          <section class="bg-amber-50/80 p-5 rounded-xl border-2 border-amber-400 space-y-4">
            <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
              <span class="px-2.5 py-0.5 rounded bg-amber-500 text-slate-950 text-xs font-extrabold">🎙️ 실제 법정 대사</span>
              사건 당사자 진술 대사 선택 (총 ${(td.speeches || []).length}개 발언)
            </h3>
            <p class="text-xs text-slate-700">
              사건 기록에 없는 거짓말이나 감정적 폭언은 피드백으로 안내됩니다. 사실에 부합하는 진술을 선택하세요.
            </p>
            ${(td.speeches || []).map(sp => {
              const chosenId = selectedSpeeches[sp.code];
              const chosenObj = sp.options.find(o => o.id === chosenId);

                  </div>

              }).join('')}

      const sp = td.speechChoice;

                <div class="flex items-start gap-2.5 text-sm text-slate-800 py-1">
                  <span class="w-5 h-5 rounded bg-indigo-100 text-indigo-900 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5">${idx + 1}</span>

            <div class="bg-white p-4 rounded-xl border border-amber-300">
              <div class="flex items-center gap-2 mb-2">

                        : 'border-slate-200 hover:border-amber-300'}">

                  ${chosenObj.feedback}
                </div>
              ` : ''}
            </div>
          </section>
        </div>
      `;

    function selectOrderAnswerF(optId) {
      appState.workshop.orderAnswer = optId;
      saveState();
      renderApp();
    }

    function validateAndCompleteStep5() {
      const roleObj = MOCK_TRIAL_DATA.roles[appState.selectedRoleId];
      const td = roleObj.typeData;

      if (roleObj.type === 'A') {
        if (!appState.workshop.selectedEvidenceIds || appState.workshop.selectedEvidenceIds.length === 0) {
          showToast('2단계에서 주장에 유리한 증거를 1~2개 선택해 주세요.', '⚠️');
          return;
        }
        const hasInvalidEv = appState.workshop.selectedEvidenceIds.some(id => {
          const ev = td.evidencePool.find(e => e.id === id);
          return ev && !ev.recommended;
        });
        if (hasInvalidEv) {
          showToast('추측성 자료가 선택되어 있습니다. 객관적 증거로 바꾸어 선택해 주세요.', '⚠️');
          return;
        }
        for (const sp of td.speeches) {
          const chosenId = appState.workshop.selectedSpeeches[sp.code];
          const opt = sp.options.find(o => o.id === chosenId);
          if (!opt) {
            showToast(`[${sp.code}] ${sp.stageLabel} 대사를 선택해 주세요.`, '⚠️');
            return;
          }
          if (!opt.valid) {
            showToast(`[${sp.code}] 적절하지 않은 대사입니다. 바른 대사를 다시 골라 주세요.`, '⚠️');
            return;
          }
        }
      } else if (roleObj.type === 'B') {
        for (const sp of td.speeches) {
          const chosenId = appState.workshop.selectedSpeeches[sp.code];
          const opt = sp.options.find(o => o.id === chosenId);
          if (!opt) {
            showToast(`[${sp.code}] ${sp.stageLabel} 진술을 선택해 주세요.`, '⚠️');
            return;
          }
          if (!opt.valid) {
            showToast(`[${sp.code}] 사건 기록과 다른 진술입니다. 사실에 부합하는 선택지를 골라 주세요.`, '⚠️');
            return;
          }
        }
      } else if (roleObj.type === 'C') {
        const sp = td.speechChoice;
        const chosenId = appState.workshop.selectedSpeeches[sp.code];
        const opt = sp.options.find(o => o.id === chosenId);
        if (!opt) {
          showToast(`[${sp.code}] 증인 답변 대사를 선택해 주세요.`, '⚠️');
          return;
        }
        if (!opt.valid) {
          showToast('증인은 직접 보고 들은 사실만 말해야 합니다. 바른 증언을 다시 골라 주세요.', '⚠️');
          return;
        }
      } else if (roleObj.type === 'D') {
        for (const sp of td.speechChoices) {
          const chosenId = appState.workshop.selectedSpeeches[sp.code];
          const opt = sp.options.find(o => o.id === chosenId);
          if (!opt) {
            showToast(`[${sp.code}] ${sp.stageLabel} 대사를 선택해 주세요.`, '⚠️');
            return;
          }
          if (!opt.valid) {
            showToast(`[${sp.code}] 판사는 공정하고 중립적인 진행 대사를 선택해야 합니다.`, '⚠️');
            return;
          }
        }
      } else if (roleObj.type === 'E') {
        const sp = td.speechChoice;
        const chosenId = appState.workshop.selectedSpeeches[sp.code];
        const opt = sp.options.find(o => o.id === chosenId);
        if (!opt) {
          showToast(`[${sp.code}] 배심원 선서 대사를 선택해 주세요.`, '⚠️');
          return;
        }
        if (!opt.valid) {
          showToast('공정한 배심원 선서 대사를 다시 선택해 주세요.', '⚠️');
          return;
        }
      } else if (roleObj.type === 'F') {
        if (td.roleSubtype === 'bailiff') {
          for (const sp of td.speechChoices) {
            const chosenId = appState.workshop.selectedSpeeches[sp.code];
            const opt = sp.options.find(o => o.id === chosenId);
            if (!opt) {
              showToast(`[${sp.code}] ${sp.stageLabel} 대사를 선택해 주세요.`, '⚠️');
              return;
            }
            if (!opt.valid) {
              showToast(`[${sp.code}] 법정 질서를 지키는 바른 안내 대사를 선택해 주세요.`, '⚠️');
              return;
            }
          }
        } else {
          const sp = td.speechChoice;
          const chosenId = appState.workshop.selectedSpeeches[sp.code];
          const opt = sp.options.find(o => o.id === chosenId);
          if (!opt) {
            showToast(`[${sp.code}] 관찰 보고 대사를 선택해 주세요.`, '⚠️');
            return;
          }
          if (!opt.valid) {
            showToast('공정한 관찰 보고 대사를 다시 선택해 주세요.', '⚠️');
            return;
          }
        }
      }

      navigateToStep(6);
      showToast('나의 모의재판 대본이 완성되었습니다!', '🎉');
    }

    /**
     * ============================================================================
     * [STEP 6: 완성된 나의 모의재판 대본 화면]
     * ============================================================================
     */
    function buildStudentScriptLines(roleObj) {
      const td = roleObj.typeData;
      const lines = [];

      if (roleObj.type === 'A' || roleObj.type === 'B') {
        td.speeches.forEach((sp, idx) => {
          const chosenId = appState.workshop.selectedSpeeches[sp.code];
          const opt = sp.options.find(o => o.id === chosenId) || sp.options.find(o => o.valid);
          lines.push({
            orderNum: idx + 1,
            code: sp.code,
            stageLabel: sp.stageLabel,
            speaker: roleObj.name,
            text: opt ? opt.text : ''
          });
        });
      } else if (roleObj.type === 'C') {
        const sp = td.speechChoice;
        const chosenId = appState.workshop.selectedSpeeches[sp.code];
        const opt = sp.options.find(o => o.id === chosenId) || sp.options.find(o => o.valid);
        lines.push({
          orderNum: 1,
          code: sp.code,
          stageLabel: sp.stageLabel,
          speaker: roleObj.name,
          text: opt ? opt.text : ''
        });
      } else if (roleObj.type === 'D') {
        td.speechChoices.forEach((sp, idx) => {
          const chosenId = appState.workshop.selectedSpeeches[sp.code];
          const opt = sp.options.find(o => o.id === chosenId) || sp.options.find(o => o.valid);
          lines.push({
            orderNum: idx + 1,
            code: sp.code,
            stageLabel: sp.stageLabel,
            speaker: '판사',
            text: opt ? opt.text : ''
          });
        });
      } else if (roleObj.type === 'E') {
        const sp = td.speechChoice;
        const chosenId = appState.workshop.selectedSpeeches[sp.code];
        const opt = sp.options.find(o => o.id === chosenId) || sp.options.find(o => o.valid);
        lines.push({
          orderNum: 1,
          code: 'C-02',
          stageLabel: '1. 재판 개시 · 배심원 선서 (함께 낭독)',
          speaker: roleObj.name,
          text: opt ? opt.text : td.oathLine
        });
        lines.push({
          orderNum: 2,
          code: 'C-22',
          stageLabel: '7. 배심원 평결 발표 (실제 재판 평의 후 작성·낭독)',
          speaker: roleObj.name,
          text: td.verdictTemplate
        });
      } else if (roleObj.type === 'F') {
        if (td.roleSubtype === 'bailiff') {
          td.speechChoices.forEach((sp, idx) => {
            const chosenId = appState.workshop.selectedSpeeches[sp.code];
            const opt = sp.options.find(o => o.id === chosenId) || sp.options.find(o => o.valid);
            lines.push({
              orderNum: idx + 1,
              code: sp.code,
              stageLabel: sp.stageLabel,
              speaker: roleObj.name,
              text: opt ? opt.text : ''
            });
          });
        } else {
          const sp = td.speechChoice;
          const chosenId = appState.workshop.selectedSpeeches[sp.code];
          const opt = sp.options.find(o => o.id === chosenId) || sp.options.find(o => o.valid);
          lines.push({
            orderNum: 1,
            code: sp.code,
            stageLabel: sp.stageLabel,
            speaker: roleObj.name,
            text: opt ? opt.text : ''
          });
        }
      }

      return lines;
    }

    function renderStep6() {
      const caseObj = MOCK_TRIAL_DATA.cases[appState.selectedCaseId];
      const roleObj = MOCK_TRIAL_DATA.roles[appState.selectedRoleId];
      const st = appState.student;

      let usedEvidenceText = roleObj.roleCard.keyEvidence;
      if (roleObj.type === 'A' && appState.workshop.selectedEvidenceIds.length > 0) {
        const picked = roleObj.typeData.evidencePool
          .filter(e => appState.workshop.selectedEvidenceIds.includes(e.id))
          .map(e => `${e.title} (${e.desc})`);
        usedEvidenceText = picked.join(' / ');
      }

      let expectedRebuttal = '상대방은 증거의 해석이나 당시 상황의 긴박성을 다르게 주장하며 반박할 수 있으므로, 확인된 사실과 추측을 구별하여 차분히 대응합니다.';
      if (roleObj.type === 'A' && roleObj.typeData.analysisQuestions) {
        const q2 = roleObj.typeData.analysisQuestions.find(q => q.id === 'q2');

          const validOpt = q2.options.find(o => o.valid);
          if (validOpt) expectedRebuttal = validOpt.text;

      return `

              </button>
              <button type="button" onclick="navigateToStep(5)"

              </button>
            </div>

              <div>
                <p class="text-xs font-bold text-slate-500 tracking-wider uppercase">중학교 1학년 사회 모의재판 개인 대본</p>
                <h1 class="text-2xl sm:text-3xl font-black text-slate-900 font-court-serif mt-0.5">
                  나의 모의재판 대본

              <div class="text-xs sm:text-sm font-bold text-slate-800 bg-white px-4 py-2 rounded-lg border border-slate-300">

              </div>

              <div class="bg-white p-3.5 rounded-xl border border-slate-300">

                <span class="font-bold text-slate-900">[${caseObj.trialType}] ${caseObj.title} (${caseObj.caseNumber})</span>
              </div>

                <span class="font-bold text-slate-900">${roleObj.name} (${roleObj.group}) · 순서: ${roleObj.roleCard.speakingCodes.join(', ')}</span>
              </div>
              <div class="bg-white p-3.5 rounded-xl border border-slate-300 sm:col-span-2">
                <span class="text-slate-500 font-semibold block text-xs">나의 핵심 임무</span>
                <span class="text-slate-800 font-medium">${roleObj.roleCard.duty}</span>
              </div>
            </div>

            <div class="bg-amber-50/70 border-2 border-slate-800 rounded-2xl p-5 sm:p-6">
              <div class="flex items-center justify-between border-b border-slate-300 pb-2.5 mb-4">
                <h3 class="text-base sm:text-lg font-extrabold text-slate-900 flex items-center gap-2">
                  <span>🎙️ 실제 법정에서 내가 읽을 대사</span>
                </h3>
                <span class="text-xs font-bold px-2.5 py-1 rounded bg-slate-900 text-amber-300">
                  차례 번호를 확인하고 또박또박 읽으세요
                </span>
              </div>

              <div class="space-y-4">
                ${scriptLines.map(line => `
                  <div class="bg-white p-4 sm:p-5 rounded-xl border border-slate-300 shadow-sm print-break-inside-avoid">
                    <div class="flex flex-wrap items-center gap-2 mb-2">
                      <span class="px-2.5 py-0.5 rounded bg-court-navy text-amber-300 font-bold text-xs">
                        발언 ${line.orderNum} · ${line.code}

                      <span class="text-xs font-bold text-slate-600">${line.stageLabel}</span>

                  <p class="text-slate-700 leading-relaxed">${expectedRebuttal}</p>
                </div>
              </div>

          </div>

      `;

        const templates = roleObj.typeData.verdictTemplates;
        return `
          <div class="bg-slate-50 border-2 border-slate-700 rounded-2xl p-5 space-y-4 print-break-inside-avoid">

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs">
                ${caseObj.fullTimeline.map(item => `
                  <div class="flex items-center gap-1.5 bg-white px-2.5 py-1.5 rounded border border-slate-200">
                    <span class="font-bold text-slate-900 shrink-0">${item.code}</span>
                    <span class="font-semibold text-amber-800 shrink-0">[${item.speaker}]</span>
                    <span class="text-slate-600 truncate">${item.summary}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      if (roleObj.type === 'E') {
        const notes = appState.workshop.jurorNotes;
        return `
          <div class="bg-slate-50 border-2 border-slate-700 rounded-2xl p-5 space-y-4 print-break-inside-avoid">
            <h3 class="text-base font-extrabold text-slate-900">📋 [배심원 전용] 법정 관찰 기록표 및 평결 작성란 (활동지 기록용)</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
              <div class="bg-white p-3 rounded-xl border border-slate-300 min-h-[76px]">
                <p class="font-bold text-rose-900 mb-1">1. 검사 측이 제시한 주요 증거</p>
                <p class="text-slate-800 whitespace-pre-wrap">${escapeHtml(notes.prosecutionEv) || '_________________________________________'}</p>
              </div>
              <div class="bg-white p-3 rounded-xl border border-slate-300 min-h-[76px]">
                <p class="font-bold text-sky-900 mb-1">2. 변호인 측이 제시한 주요 증거</p>
                <p class="text-slate-800 whitespace-pre-wrap">${escapeHtml(notes.defenseEv) || '_________________________________________'}</p>
              </div>
              <div class="bg-white p-3 rounded-xl border border-slate-300 min-h-[76px]">
                <p class="font-bold text-emerald-900 mb-1">3. 신뢰할 수 있었던 증언</p>
                <p class="text-slate-800 whitespace-pre-wrap">${escapeHtml(notes.reliableTestimony) || '_________________________________________'}</p>
              </div>
              <div class="bg-white p-3 rounded-xl border border-slate-300 min-h-[76px]">
                <p class="font-bold text-amber-900 mb-1">4. 여전히 의문이 남는 부분</p>
                <p class="text-slate-800 whitespace-pre-wrap">${escapeHtml(notes.remainingDoubts) || '_________________________________________'}</p>
              </div>
            </div>

            <div class="bg-white p-4 rounded-xl border-2 border-amber-500 text-xs space-y-2">
              <p class="font-extrabold text-slate-900">⚖️ 배심원 평결 의견 (실제 재판 후 배심원 평의 시 손으로 직접 체크·작성)</p>
              <div class="flex flex-wrap items-center gap-6 py-1 font-bold text-slate-800">
                <span>[ &nbsp; ] 무죄 (정당방위 인정)</span>
                <span>[ &nbsp; ] 유죄 (정당방위 불인정)</span>
              </div>
              <div class="pt-1">
                <p class="font-bold text-slate-700 mb-1">평결 근거 한 문장:</p>
                <p class="text-slate-400">__________________________________________________________________________________</p>
              </div>
            </div>
          </div>
        `;
      }

      if (roleObj.type === 'F' && roleObj.typeData.roleSubtype === 'sketch') {
        return `
          <div class="bg-slate-50 border-2 border-slate-700 rounded-2xl p-5 space-y-4 print-break-inside-avoid">
            <h3 class="text-base font-extrabold text-slate-900">🎨 [스케치 작가 전용] 법정 장면 스케치 & 공정성 관찰표 (활동지 기록용)</h3>
            <div class="bg-white border-2 border-dashed border-slate-400 rounded-xl h-48 flex items-center justify-center text-xs text-slate-400">
              (모의재판 진행 중 법정의 주요 증거와 변론 장면을 이 칸에 스케치하세요)
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-300 space-y-2 text-xs">
              <p class="font-extrabold text-slate-900 mb-1">📋 공정한 재판 관찰 기록 체크리스트 (재판 중 직접 표시)</p>
              ${roleObj.typeData.checklistItems.map(item => `
                <div class="flex items-start gap-2 text-slate-800">
                  <span class="font-mono font-bold">[ &nbsp; ]</span>
                  <span>${item}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      return '';
    }

    function handleCopyFullScript() {
      const caseObj = MOCK_TRIAL_DATA.cases[appState.selectedCaseId];
      const roleObj = MOCK_TRIAL_DATA.roles[appState.selectedRoleId];
      const st = appState.student;
      const pt = appState.preTrialJudgment;
      const lines = buildStudentScriptLines(roleObj);

      let text = `[나의 모의재판 대본]\n`;
      text += `학생: ${st.grade}학년 ${st.classNum || '-'}반 ${st.number || '-'}번 ${st.name}\n`;
      text += `사건: [${caseObj.trialType}] ${caseObj.title} (${caseObj.caseNumber})\n`;
      text += `역할: ${roleObj.name} (${roleObj.group}) | 발언 차례: ${roleObj.roleCard.speakingCodes.join(', ')}\n`;
      text += `핵심 임무: ${roleObj.roleCard.duty}\n`;
      text += `----------------------------------------\n`;
      text += `🎙️ 실제 법정에서 내가 읽을 대사\n\n`;
      lines.forEach(l => {
        text += `[발언 ${l.orderNum} · ${l.code}] ${l.stageLabel}\n`;
        text += `${l.speaker}: "${l.text}"\n\n`;
      });
      text += `----------------------------------------\n`;
      text += `📑 나의 재판 준비 노트\n`;
      text += `- 재판 전 잠정적 판결: ${pt.choiceLabel || '미선택'}${pt.reason ? ` (이유: ${pt.reason})` : ''}\n`;
      text += `- 주의해야 할 점: ${roleObj.roleCard.caution}\n`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('대본 전체가 클립보드에 복사되었습니다!', '📋');
        }).catch(() => {
          fallbackCopyText(text);
        });
      } else {
        fallbackCopyText(text);
      }
    }

    function fallbackCopyText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('대본 전체가 클립보드에 복사되었습니다!', '📋');
      } catch (e) {
        showToast('복사에 실패했습니다. 인쇄 버튼을 이용해 주세요.', '⚠️');
      }
      document.body.removeChild(ta);
    }

    /**
     * ============================================================================
     * [XSS 방지 이스케이프 및 메인 렌더 루프]
     * ============================================================================
     */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderApp() {
      if (appState.currentStep > 1 && (!appState.selectedRoleId || !MOCK_TRIAL_DATA.roles[appState.selectedRoleId])) {
        appState.currentStep = 1;
      }
      if (appState.currentStep > 6) {
        appState.currentStep = 6;
      }

      renderHeaderAndStepper();
      const container = document.getElementById('app-container');

      switch (appState.currentStep) {
        case 1:
          container.innerHTML = renderStep1();
          break;
        case 2:
          container.innerHTML = renderStep2();
          break;
        case 3:
          container.innerHTML = renderStep3();
          break;
        case 4:
          container.innerHTML = renderStep4();
          break;
        case 5:
          container.innerHTML = renderStep5();
          break;
        case 6:
          container.innerHTML = renderStep6();
          break;
        default:
          container.innerHTML = renderStep1();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
